<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Aseta salasana – BarShift</title>
<link rel="stylesheet" href="assets/widget.css">
<style>
  body { background: #F4F7F9; display:flex; min-height:100vh; align-items:center; justify-content:center; padding:16px; }
  .box { background:#fff; border:1px solid var(--border); border-radius:16px; padding:28px 24px; width:100%; max-width:400px; box-shadow:0 4px 24px rgba(0,0,0,.05); }
  .brand { font-size:22px; font-weight:800; margin-bottom:14px; } .brand b { color:var(--accent); }
  h1 { font-size:18px; margin:0 0 6px; } p { color:var(--text2); margin:0 0 14px; }
  label { display:block; font-size:12px; font-weight:700; color:var(--text2); text-transform:uppercase; margin:12px 0 4px; }
  input { width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:10px; font:inherit; }
  button { margin-top:18px; width:100%; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:#B91C1C; background:#FEF2F2; border-radius:8px; padding:8px 10px; margin-top:12px; font-size:13px; display:none; }
  .ok a { color:var(--accent); font-weight:700; }
  .login-id { background:#F1F5F9; border-radius:8px; padding:8px 10px; font-family:monospace; margin-bottom:8px; word-break:break-all; }
  small { color:var(--text2); }
</style>
</head>
<body>
<div class="box">
  <div class="brand">Bar<b>Shift</b></div>
  <div id="content">Ladataan…</div>
</div>
<script src="assets/setpassword.js"></script>
</body>
</html>
